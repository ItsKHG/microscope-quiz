<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microscope Parts Quiz</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; }
  .container { max-width: 850px; margin: 36px auto; padding: 24px; }
  header, .quiz-card, .results { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 5px 18px #17203312; }
  header { margin-bottom: 18px; }
  h1 { margin: 0 0 8px; color: #174a7e; }
  .muted { color: #596579; line-height: 1.5; }
  .topline { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 18px 0 10px; font-weight: bold; }
  .progress { height: 10px; background: #e2e8f0; border-radius: 20px; overflow: hidden; margin-bottom: 22px; }
  .progress-bar { height: 100%; width: 0%; background: #2185d5; transition: width .2s; }
  .question { font-size: 1.2rem; font-weight: bold; line-height: 1.45; margin: 0 0 18px; }
  .option { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; border: 2px solid #dce3ec; border-radius: 10px; margin: 10px 0; cursor: pointer; line-height: 1.4; }
  .option:hover { border-color: #76a9dc; background: #f8fbff; }
  .option input { margin-top: 3px; }
  .option.correct { border-color: #24945a; background: #ecfdf3; }
  .option.incorrect { border-color: #d14343; background: #fff1f1; }
  .feedback { min-height: 28px; margin: 14px 0; font-weight: bold; line-height: 1.45; }
  .feedback.good { color: #167443; }
  .feedback.bad { color: #b42318; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  button { border: 0; border-radius: 9px; padding: 12px 18px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .primary { background: #1769aa; color: white; }
  .secondary { background: #e8edf3; color: #172033; }
  .results { display: none; }
  .results h2 { color: #174a7e; }
  .review-item { border-top: 1px solid #e2e8f0; padding: 14px 0; line-height: 1.5; }
  .score { font-size: 1.4rem; font-weight: bold; }
  @media (max-width: 600px) { .container { padding: 12px; margin: 12px auto; } header, .quiz-card, .results { padding: 18px; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Microscope Parts Quiz</h1>
    <p class="muted">Test your knowledge of microscope parts. Choose one answer for each question, check your answer, and see your score at the end.</p>
    <div class="topline"><span id="questionCount">Question 1 of 10</span><span id="scoreDisplay">Score: 0</span></div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </header>

  <section class="quiz-card" id="quizCard">
    <p class="question" id="questionText"></p>
    <div id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="buttons">
      <button class="primary" id="checkBtn">Check answer</button>
      <button class="primary" id="nextBtn" hidden>Next question</button>
    </div>
  </section>

  <section class="results" id="results">
    <h2>Quiz complete!</h2>
    <p class="score" id="finalScore"></p>
    <p id="finalMessage"></p>
    <div id="review"></div>
    <div class="buttons"><button class="primary" id="restartBtn">Try again</button></div>
  </section>
</div>

<script>
const questions = [
  {
    number: 2,
    question: "What do the objective lenses do?",
    options: {
      A: "They hold the slide in place.",
      B: "They sit near the specimen and provide primary magnification power (such as 4x, 10x, or 40x).",
      C: "They control how much light reaches the specimen.",
      D: "They support the microscope on the table."
    },
    answer: "B",
    explanation: "Objective lenses do the first stage of magnifying the sample."
  },
  {
    number: 13,
    question: "What is the purpose of the revolving nosepiece?",
    options: {
      A: "To switch between different objective lenses and change the level of magnification.",
      B: "To adjust the brightness of the light.",
      C: "To hold the slide firmly on the stage.",
      D: "To make small focusing adjustments."
    },
    answer: "A",
    explanation: "Rotating the nosepiece clicks different power lenses into place."
  },
  {
    number: 14,
    question: "What is the function of the stage?",
    options: {
      A: "It carries the microscope when it is moved.",
      B: "It magnifies the specimen for the first time.",
      C: "It controls the amount of light.",
      D: "It provides a flat platform where the microscope slide is placed for viewing."
    },
    answer: "D",
    explanation: "The stage holds the slide right over the light aperture."
  },
  {
    number: 15,
    question: "What do stage clips do?",
    options: {
      A: "They change the magnification.",
      B: "They provide light from below the slide.",
      C: "They hold the glass slide firmly in place on the stage so it does not drift.",
      D: "They support the microscope's upper tube."
    },
    answer: "C",
    explanation: "Stage clips keep the slide steady while you look at it."
  },
  {
    number: 16,
    question: "What does the diaphragm do?",
    options: {
      A: "It regulates the amount of light passing through the aperture and up to the specimen.",
      B: "It moves the stage up and down quickly.",
      C: "It holds the slide in place.",
      D: "It magnifies the specimen."
    },
    answer: "A",
    explanation: "The diaphragm acts like an iris to adjust brightness and contrast."
  },
  {
    number: 17,
    question: "What is the job of the light source?",
    options: {
      A: "To keep the microscope steady.",
      B: "It shines light up through the specimen so it can be seen clearly through the lenses.",
      C: "To rotate the objective lenses.",
      D: "To make the image sharply focused."
    },
    answer: "B",
    explanation: "The light source illuminates the slide from below."
  },
  {
    number: 18,
    question: "Which part is used for quick, initial focusing?",
    options: {
      A: "The fine adjustment knob",
      B: "The diaphragm",
      C: "The coarse adjustment knob",
      D: "The revolving nosepiece"
    },
    answer: "C",
    explanation: "The coarse knob moves the stage up and down a lot for a quick initial focus."
  },
  {
    number: 19,
    question: "What does the fine adjustment knob do?",
    options: {
      A: "It changes the objective lens.",
      B: "It supports the microscope.",
      C: "It controls the light source.",
      D: "To make very small, precise adjustments to sharpen the focus of the image."
    },
    answer: "D",
    explanation: "The fine adjustment knob clears up the fine details."
  },
  {
    number: 20,
    question: "What is the function of the arm?",
    options: {
      A: "It connects the upper tube/head to the base and serves as a safe handle for carrying the microscope.",
      B: "It holds the slide over the light.",
      C: "It provides the main magnification.",
      D: "It changes the amount of light."
    },
    answer: "A",
    explanation: "You grip the arm with one hand while supporting the base with the other."
  },
  {
    number: 21,
    question: "What does the base do?",
    options: {
      A: "It adjusts the focus.",
      B: "It provides a heavy, stable foundation that supports the entire weight of the microscope.",
      C: "It holds the objective lenses.",
      D: "It keeps the slide from drifting."
    },
    answer: "B",
    explanation: "The base keeps the microscope steady and balanced on the table."
  }
];

let current = 0;
let score = 0;
let checked = false;
let answers = [];

const questionText = document.getElementById("questionText");
const optionsEl = document.getElementById("options");
const feedback = document.getElementById("feedback");
const checkBtn = document.getElementById("checkBtn");
const nextBtn = document.getElementById("nextBtn");

function renderQuestion() {
  checked = false;
  const q = questions[current];
  document.getElementById("questionCount").textContent = `Question ${current + 1} of ${questions.length} (original #${q.number})`;
  document.getElementById("scoreDisplay").textContent = `Score: ${score}`;
  document.getElementById("progressBar").style.width = `${(current / questions.length) * 100}%`;
  questionText.textContent = q.question;
  optionsEl.innerHTML = "";
  Object.entries(q.options).forEach(([letter, text]) => {
    const label = document.createElement("label");
    label.className = "option";
    label.dataset.letter = letter;
    label.innerHTML = `<input type="radio" name="answer" value="${letter}"><span><strong>${letter})</strong> ${text}</span>`;
    optionsEl.appendChild(label);
  });
  feedback.textContent = "";
  feedback.className = "feedback";
  checkBtn.hidden = false;
  checkBtn.disabled = false;
  nextBtn.hidden = true;
}

checkBtn.addEventListener("click", () => {
  if (checked) return;
  const selected = document.querySelector('input[name="answer"]:checked');
  if (!selected) {
    feedback.textContent = "Choose an answer first.";
    feedback.className = "feedback bad";
    return;
  }
  checked = true;
  const q = questions[current];
  const chosen = selected.value;
  const isCorrect = chosen === q.answer;
  answers[current] = { chosen, isCorrect };
  if (isCorrect) score++;
  document.querySelectorAll(".option").forEach(label => {
    const letter = label.dataset.letter;
    label.querySelector("input").disabled = true;
    if (letter === q.answer) label.classList.add("correct");
    if (letter === chosen && !isCorrect) label.classList.add("incorrect");
  });
  feedback.textContent = (isCorrect ? "Correct! " : `Not quite. The correct answer is ${q.answer}. `) + q.explanation;
  feedback.className = "feedback " + (isCorrect ? "good" : "bad");
  document.getElementById("scoreDisplay").textContent = `Score: ${score}`;
  checkBtn.hidden = true;
  nextBtn.hidden = false;
  nextBtn.textContent = current === questions.length - 1 ? "See results" : "Next question";
});

nextBtn.addEventListener("click", () => {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.querySelector("header").style.display = "none";
  const results = document.getElementById("results");
  results.style.display = "block";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("finalScore").textContent = `You scored ${score} out of ${questions.length} (${Math.round(score / questions.length * 100)}%).`;
  document.getElementById("finalMessage").textContent =
    score === questions.length ? "Perfect score! You know your microscope parts very well." :
    score >= 7 ? "Nice work! Review any questions you missed and try again." :
    "Keep practising! Read the explanations, then try the quiz again.";
  const review = document.getElementById("review");
  review.innerHTML = "<h3>Answer review</h3>";
  questions.forEach((q, i) => {
    const a = answers[i];
    const item = document.createElement("div");
    item.className = "review-item";
    item.innerHTML = `<strong>Question ${q.number}:</strong> ${q.question}<br>
      Your answer: ${a ? a.chosen : "Not answered"} ${a && a.isCorrect ? "✓" : ""}<br>
      Correct answer: ${q.answer}) ${q.options[q.answer]}<br>
      <span class="muted">${q.explanation}</span>`;
    review.appendChild(item);
  });
}

document.getElementById("restartBtn").addEventListener("click", () => {
  current = 0; score = 0; answers = [];
  document.getElementById("quizCard").style.display = "block";
  document.querySelector("header").style.display = "block";
  document.getElementById("results").style.display = "none";
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
